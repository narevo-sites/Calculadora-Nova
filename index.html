<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest.json">

<title>Calculadora Nova</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#080808;
    color:white;
    min-height:100vh;
}

button,input{
    font-family:inherit;
}

.screen{
    display:none;
    width:100%;
    min-height:100vh;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.screen.active{
    display:flex;
}

/* LOGIN */

.login-box{
    width:100%;
    max-width:390px;
    background:#121212;
    border:1px solid #292929;
    border-radius:28px;
    padding:30px 24px;
    text-align:center;
    box-shadow:0 0 35px rgba(124,58,237,.25);
}

.logo-css{
    width:150px;
    height:150px;
    margin:0 auto 22px;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    overflow:hidden;
    border-radius:28px;
    border:4px solid white;
    box-shadow:0 0 25px rgba(124,58,237,.45);
}

.logo-cuadro{
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
    font-weight:bold;
}

.logo-negro{
    background:#050505;
    color:white;
}

.logo-morado{
    background:#7c3aed;
    color:white;
}

.igual{
    font-size:38px;
}

h1{
    font-size:34px;
    margin-bottom:8px;
}

.subtitulo{
    color:#aaa;
    margin-bottom:25px;
}

.password{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:2px solid #333;
    background:#090909;
    color:white;
    text-align:center;
    font-size:22px;
    outline:none;
    margin-bottom:14px;
}

.password:focus{
    border-color:#7c3aed;
}

.btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:#7c3aed;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    background:#8b5cf6;
}

.error{
    color:#ff5252;
    margin-top:12px;
    min-height:20px;
}

/* CALCULADORA */

.calculator{
    width:100%;
    max-width:430px;
    background:#111;
    border:1px solid #292929;
    border-radius:30px;
    padding:18px;
    box-shadow:0 0 40px rgba(124,58,237,.2);
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.title{
    font-size:24px;
    font-weight:bold;
}

.menu-btn{
    width:50px;
    height:50px;
    border:none;
    border-radius:15px;
    background:#7c3aed;
    color:white;
    font-size:25px;
    cursor:pointer;
}

.display{
    min-height:125px;
    background:#070707;
    border:1px solid #292929;
    border-radius:22px;
    padding:18px;
    margin-bottom:15px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    overflow:hidden;
}

.previous{
    min-height:25px;
    color:#888;
    text-align:right;
    font-size:16px;
    overflow-wrap:anywhere;
}

.current{
    color:white;
    text-align:right;
    font-size:42px;
    font-weight:bold;
    overflow-wrap:anywhere;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.calc-btn{
    min-height:68px;
    border:none;
    border-radius:18px;
    background:#202020;
    color:white;
    font-size:23px;
    font-weight:bold;
    cursor:pointer;
    transition:.12s;
}

.calc-btn:hover{
    background:#303030;
}

.calc-btn:active{
    transform:scale(.95);
}

.operator{
    background:#7c3aed;
}

.operator:hover{
    background:#8b5cf6;
}

.clear{
    background:#a21caf;
}

.equals{
    background:#5b21b6;
}

/* MENU */

.menu{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    justify-content:flex-end;
    z-index:20;
}

.menu.open{
    display:flex;
}

.menu-panel{
    width:min(330px,88%);
    height:100%;
    background:#111;
    padding:22px;
    box-shadow:-10px 0 35px rgba(0,0,0,.5);
    overflow-y:auto;
}

.menu-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.menu-header h2{
    font-size:25px;
}

.close{
    width:42px;
    height:42px;
    border:none;
    border-radius:12px;
    background:#292929;
    color:white;
    font-size:22px;
    cursor:pointer;
}

.menu-item{
    width:100%;
    padding:16px;
    margin-bottom:10px;
    border:1px solid #292929;
    border-radius:14px;
    background:#191919;
    color:white;
    text-align:left;
    font-size:16px;
    cursor:pointer;
}

.menu-item:hover{
    background:#7c3aed;
}

/* PROBLEMAS */

.problem-box{
    width:100%;
    max-width:430px;
    background:#111;
    border:1px solid #292929;
    border-radius:28px;
    padding:25px;
}

.problem-box h2{
    margin-bottom:20px;
}

.problem{
    background:#080808;
    border-radius:18px;
    padding:22px;
    text-align:center;
    font-size:27px;
    margin-bottom:15px;
}

.answer{
    width:100%;
    padding:15px;
    border-radius:13px;
    border:2px solid #333;
    background:#080808;
    color:white;
    font-size:20px;
    text-align:center;
    outline:none;
}

.answer:focus{
    border-color:#7c3aed;
}

.result{
    text-align:center;
    margin-top:15px;
    min-height:25px;
}

.back{
    margin-top:15px;
    background:#292929;
}

/* HISTORIAL */

.history-list{
    max-height:350px;
    overflow-y:auto;
}

.history-item{
    padding:12px;
    background:#191919;
    border-radius:12px;
    margin-bottom:8px;
    color:#ddd;
}

@media(max-width:420px){

    .calculator{
        padding:13px;
        border-radius:24px;
    }

    .calc-btn{
        min-height:62px;
        font-size:21px;
    }

    .current{
        font-size:35px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen" class="screen active">

<div class="login-box">

<div class="logo-css">

<div class="logo-cuadro logo-negro">+</div>

<div class="logo-cuadro logo-morado">−</div>

<div class="logo-cuadro logo-morado">×</div>

<div class="logo-cuadro logo-negro">
<span class="igual">=</span>
</div>

</div>

<h1>Calculadora Nova</h1>

<p class="subtitulo">
Calculadora matemática
</p>

<input
id="password"
class="password"
type="password"
inputmode="numeric"
maxlength="4"
placeholder="Contraseña"
>

<button class="btn" onclick="entrar()">
ENTRAR
</button>

<div id="error" class="error"></div>

</div>

</section>


<!-- CALCULADORA -->

<section id="calculatorScreen" class="screen">

<div class="calculator">

<div class="top">

<div class="title">
Nova
</div>

<button class="menu-btn" onclick="abrirMenu()">
☰
</button>

</div>

<div class="display">

<div id="previous" class="previous"></div>

<div id="current" class="current">
0
</div>

</div>

<div class="buttons">

<button class="calc-btn clear" onclick="limpiar()">C</button>
<button class="calc-btn" onclick="borrar()">⌫</button>
<button class="calc-btn" onclick="agregar('(')">(</button>
<button class="calc-btn operator" onclick="agregar(')')">)</button>

<button class="calc-btn" onclick="agregar('7')">7</button>
<button class="calc-btn" onclick="agregar('8')">8</button>
<button class="calc-btn" onclick="agregar('9')">9</button>
<button class="calc-btn operator" onclick="agregar('/')">÷</button>

<button class="calc-btn" onclick="agregar('4')">4</button>
<button class="calc-btn" onclick="agregar('5')">5</button>
<button class="calc-btn" onclick="agregar('6')">6</button>
<button class="calc-btn operator" onclick="agregar('*')">×</button>

<button class="calc-btn" onclick="agregar('1')">1</button>
<button class="calc-btn" onclick="agregar('2')">2</button>
<button class="calc-btn" onclick="agregar('3')">3</button>
<button class="calc-btn operator" onclick="agregar('-')">−</button>

<button class="calc-btn" onclick="agregar('0')">0</button>
<button class="calc-btn" onclick="agregar('.')">.</button>
<button class="calc-btn" onclick="agregar('%')">%</button>
<button class="calc-btn operator" onclick="agregar('+')">+</button>

<button
class="calc-btn equals"
style="grid-column:span 4;"
onclick="calcular()">
=
</button>

</div>
</div>

</section>


<!-- MENU -->

<div id="menu" class="menu">

<div class="menu-panel">

<div class="menu-header">

<h2>Menú</h2>

<button class="close" onclick="cerrarMenu()">
×
</button>

</div>

<button class="menu-item"
onclick="abrirProblema('Operaciones')">
Operaciones
</button>

<button class="menu-item"
onclick="abrirProblema('Porcentajes')">
Porcentajes
</button>

<button class="menu-item"
onclick="abrirProblema('Potencias')">
Potencias
</button>

<button class="menu-item"
onclick="abrirProblema('Raíces cuadradas')">
Raíces cuadradas
</button>

<button class="menu-item"
onclick="abrirProblema('Ecuaciones')">
Ecuaciones
</button>

<button class="menu-item"
onclick="abrirProblema('Geometría')">
Geometría
</button>

<button class="menu-item"
onclick="mostrarHistorial()">
Historial
</button>

<button class="menu-item"
onclick="limpiar();cerrarMenu()">
Limpiar calculadora
</button>

</div>

</div>


<!-- PROBLEMAS -->

<section id="problemScreen" class="screen">

<div class="problem-box">

<h2 id="problemTitle">
Problema
</h2>

<div id="problem" class="problem">
—
</div>

<input
id="answer"
class="answer"
type="number"
placeholder="Escribí tu respuesta"
>

<button
class="btn"
style="margin-top:12px;"
onclick="comprobarProblema()">
COMPROBAR
</button>

<div id="result" class="result"></div>

<button
class="btn back"
onclick="volverCalculadora()">
VOLVER
</button>

</div>

</section>


<!-- HISTORIAL -->

<section id="historyScreen" class="screen">

<div class="problem-box">

<h2>
Historial
</h2>

<div id="historyList" class="history-list">
</div>

<button
class="btn back"
onclick="volverCalculadora()">
VOLVER
</button>

</div>

</section>


<script>

const CONTRASENA = "4231";

let expresion = "";
let historial = [];
let respuestaCorrecta = 0;

const current =
document.getElementById("current");

const previous =
document.getElementById("previous");


function entrar(){

const password =
document.getElementById("password").value;

const error =
document.getElementById("error");

if(password === CONTRASENA){

document
.getElementById("loginScreen")
.classList.remove("active");

document
.getElementById("calculatorScreen")
.classList.add("active");

error.textContent="";

}else{

error.textContent =
"Contraseña incorrecta.";

}

}


function agregar(valor){

expresion += valor;

actualizarPantalla();

}


function actualizarPantalla(){

let mostrar =
expresion
.replace(/\*/g,"×")
.replace(/\//g,"÷");

current.textContent =
mostrar || "0";

}


function limpiar(){

expresion="";

current.textContent="0";
previous.textContent="";

}


function borrar(){

expresion =
expresion.slice(0,-1);

actualizarPantalla();

}


function calcular(){

if(!expresion)return;

try{

let resultado =
Function(
'"use strict";return (' +
expresion +
')'
)();

if(!Number.isFinite(resultado)){
throw new Error();
}

previous.textContent =
expresion
.replace(/\*/g,"×")
.replace(/\//g,"÷")
+" =";

current.textContent=resultado;

historial.unshift(
expresion
.replace(/\*/g,"×")
.replace(/\//g,"÷")
+" = "+resultado
);

expresion=String(resultado);

}catch{

current.textContent="Error";

expresion="";

}

}


document.addEventListener(
"keydown",
function(event){

if(event.key>="0" && event.key<="9"){
agregar(event.key);
}

if(
["+","+","-","*","/","."].includes(event.key)
){
agregar(event.key);
}

if(event.key==="(" || event.key===")"){
agregar(event.key);
}

if(event.key==="Enter"){
calcular();
}

if(event.key==="Backspace"){
borrar();
}

if(event.key==="Escape"){
limpiar();
}

}
);


function abrirMenu(){

document
.getElementById("menu")
.classList.add("open");

}


function cerrarMenu(){

document
.getElementById("menu")
.classList.remove("open");

}


function abrirProblema(tipo){

cerrarMenu();

document
.getElementById("calculatorScreen")
.classList.remove("active");

document
.getElementById("problemScreen")
.classList.add("active");

document
.getElementById("problemTitle")
.textContent=tipo;

generarProblema(tipo);

}


function generarProblema(tipo){

const problema =
document.getElementById("problem");

const answer =
document.getElementById("answer");

const result =
document.getElementById("result");

answer.value="";
result.textContent="";

let a,b;

if(tipo==="Operaciones"){

a=Math.floor(Math.random()*100)+1;
b=Math.floor(Math.random()*100)+1;

const operaciones=["+","-","*"];

const op =
operaciones[
Math.floor(
Math.random()*operaciones.length
)
];

problema.textContent =
`${a} ${op==="*"?"×":op} ${b}`;

respuestaCorrecta =
op==="+" ? a+b :
op==="-" ? a-b :
a*b;

}

else if(tipo==="Porcentajes"){

a=Math.floor(Math.random()*90)+10;

b=(Math.floor(Math.random()*9)+1)*10;

problema.textContent =
`${b}% de ${a}`;

respuestaCorrecta =
a*b/100;

}

else if(tipo==="Potencias"){

a=Math.floor(Math.random()*10)+1;

b=Math.floor(Math.random()*3)+2;

problema.textContent =
`${a}^${b}`;

respuestaCorrecta =
Math.pow(a,b);

}

else if(tipo==="Raíces cuadradas"){

a=Math.floor(Math.random()*10)+1;

problema.textContent =
`√${a*a}`;

respuestaCorrecta=a;

}

else if(tipo==="Ecuaciones"){

a=Math.floor(Math.random()*20)+1;

b=Math.floor(Math.random()*50)+1;

problema.textContent =
`x + ${b} = ${a+b}`;

respuestaCorrecta=a;

}

else if(tipo==="Geometría"){

a=Math.floor(Math.random()*10)+1;

problema.textContent =
`Área de un cuadrado de lado ${a}`;

respuestaCorrecta=a*a;

}

}


function comprobarProblema(){

const input =
document.getElementById("answer");

const result =
document.getElementById("result");

if(input.value===""){

result.textContent=
"Escribí una respuesta.";

return;

}

const respuesta =
Number(input.value);

if(respuesta===respuestaCorrecta){

result.textContent=
"Respuesta correcta.";

}else{

result.textContent=
"Respuesta incorrecta.";

}

}


function mostrarHistorial(){

cerrarMenu();

document
.getElementById("calculatorScreen")
.classList.remove("active");

document
.getElementById("historyScreen")
.classList.add("active");

const lista =
document.getElementById("historyList");

if(historial.length===0){

lista.innerHTML=
"<p>No hay operaciones todavía.</p>";

return;

}

lista.innerHTML =
historial
.map(
item =>
`<div class="history-item">
${item}
</div>`
)
.join("");

}


function volverCalculadora(){

document
.getElementById("problemScreen")
.classList.remove("active");

document
.getElementById("historyScreen")
.classList.remove("active");

document
.getElementById("calculatorScreen")
.classList.add("active");

}


if("serviceWorker" in navigator){

window.addEventListener(
"load",
()=>{

navigator.serviceWorker
.register("./sw.js")
.then(()=>{
console.log(
"Calculadora Nova lista"
);
})
.catch(error=>{
console.log(
"Error:",
error
);
});

}
);

}

</script>

</body>
</html>
