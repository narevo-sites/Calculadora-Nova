<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#7c3aed">

<title>MateLabs Calculator</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

:root{
    --purple:#7c3aed;
    --purple2:#9f67ff;
    --dark:#171221;
    --dark2:#21182f;
    --card:#2a2039;
    --white:#ffffff;
    --soft:#eee9f7;
    --pink:#ff4fa3;
    --cyan:#35d8ff;
    --yellow:#ffd84d;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top left,#8b5cf6 0%,transparent 30%),
        radial-gradient(circle at bottom right,#ff4fa3 0%,transparent 25%),
        #120d1b;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* =========================
   PANTALLA DE CONTRASEÑA
========================= */

#login{
    width:100%;
    max-width:430px;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.login-box{
    width:100%;
    background:rgba(32,24,45,.94);
    border:1px solid rgba(255,255,255,.12);
    border-radius:30px;
    padding:35px 25px;
    box-shadow:0 25px 70px rgba(0,0,0,.45);
    text-align:center;
}

.logo{
    width:78px;
    height:78px;
    border-radius:24px;
    margin:0 auto 20px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,var(--purple),var(--pink));
    font-size:30px;
    font-weight:900;
    box-shadow:0 10px 30px rgba(124,58,237,.4);
}

.login-box h1{
    font-size:30px;
    margin-bottom:8px;
}

.login-box p{
    color:#bdb3ca;
    margin-bottom:25px;
}

.password{
    width:100%;
    height:58px;
    border:0;
    outline:none;
    border-radius:17px;
    background:#120e19;
    color:white;
    text-align:center;
    font-size:24px;
    letter-spacing:8px;
}

.login-button{
    width:100%;
    height:58px;
    margin-top:15px;
    border:0;
    border-radius:17px;
    background:linear-gradient(135deg,var(--purple),var(--purple2));
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.error{
    height:22px;
    margin-top:12px;
    color:#ff719f;
    font-size:14px;
}

/* =========================
   APP
========================= */

#app{
    display:none;
    width:100%;
    max-width:500px;
    min-height:100vh;
    background:#f4f1f8;
    color:#11101a;
    position:relative;
    overflow:hidden;
}

/* HEADER */

.header{
    height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:white;
    border-bottom:1px solid #e7e1ed;
    position:sticky;
    top:0;
    z-index:10;
}

.header-title{
    font-size:22px;
    font-weight:800;
}

.menu-btn{
    width:48px;
    height:48px;
    border:0;
    border-radius:15px;
    background:#f0eafa;
    color:var(--purple);
    font-size:27px;
    cursor:pointer;
}

/* DISPLAY */

.calculator{
    padding:15px;
}

.display{
    min-height:150px;
    border-radius:25px;
    background:linear-gradient(145deg,#21172e,#342046);
    color:white;
    padding:25px 20px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    text-align:right;
    box-shadow:0 12px 30px rgba(36,20,53,.2);
    overflow:hidden;
}

.previous{
    color:#b8a9c9;
    font-size:17px;
    min-height:25px;
    word-break:break-all;
}

.current{
    font-size:43px;
    font-weight:700;
    margin-top:7px;
    word-break:break-all;
}

/* BUTTONS */

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:14px;
}

.btn{
    min-height:72px;
    border:0;
    border-radius:20px;
    background:white;
    color:#17131e;
    font-size:25px;
    font-weight:500;
    box-shadow:0 4px 10px rgba(35,20,50,.07);
    cursor:pointer;
    transition:.12s;
}

.btn:active{
    transform:scale(.94);
}

.function{
    background:#eee8f8;
    color:var(--purple);
    font-weight:700;
}

.operator{
    background:#eadcff;
    color:#7029dc;
    font-weight:800;
}

.equals{
    background:linear-gradient(135deg,#7c3aed,#a855f7);
    color:white;
    font-weight:800;
}

.zero{
    grid-column:span 2;
}

/* =========================
   MENU LATERAL
========================= */

.menu{
    position:fixed;
    top:0;
    right:-100%;
    width:min(390px,92%);
    height:100vh;
    background:#20172c;
    color:white;
    z-index:50;
    transition:.3s ease;
    box-shadow:-20px 0 50px rgba(0,0,0,.35);
    overflow-y:auto;
}

.menu.open{
    right:0;
}

.menu-head{
    padding:22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.menu-head h2{
    font-size:23px;
}

.close-menu{
    width:45px;
    height:45px;
    border:0;
    border-radius:14px;
    background:#362544;
    color:white;
    font-size:23px;
}

.menu-content{
    padding:18px;
}

.menu-section{
    margin-bottom:22px;
}

.menu-section h3{
    font-size:13px;
    color:#a99ab9;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:10px;
}

.menu-item{
    width:100%;
    padding:16px;
    border:0;
    border-radius:17px;
    margin-bottom:9px;
    background:#2c203b;
    color:white;
    text-align:left;
    font-size:16px;
    cursor:pointer;
}

.menu-item:hover{
    background:#3b2a50;
}

.menu-item strong{
    display:block;
    margin-bottom:4px;
}

.menu-item span{
    color:#aaa0b7;
    font-size:13px;
}

/* =========================
   MODALES
========================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(8,5,12,.68);
    backdrop-filter:blur(5px);
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.overlay.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:440px;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    color:#17131e;
    border-radius:27px;
    padding:25px;
    box-shadow:0 30px 80px rgba(0,0,0,.4);
}

.modal h2{
    margin-bottom:8px;
}

.modal-description{
    color:#6c6374;
    margin-bottom:20px;
    line-height:1.4;
}

.problem{
    background:#f2edf8;
    border-radius:20px;
    padding:22px;
    text-align:center;
    margin-bottom:15px;
}

.problem-text{
    font-size:31px;
    font-weight:800;
    margin-bottom:18px;
}

.answer-input{
    width:100%;
    height:55px;
    border:2px solid #ddd2e8;
    border-radius:15px;
    padding:0 15px;
    font-size:20px;
    outline:none;
}

.answer-input:focus{
    border-color:var(--purple);
}

.action{
    width:100%;
    height:55px;
    margin-top:12px;
    border:0;
    border-radius:15px;
    background:var(--purple);
    color:white;
    font-size:17px;
    font-weight:bold;
}

.secondary{
    background:#eee9f3;
    color:#382d43;
}

.result{
    min-height:25px;
    text-align:center;
    margin-top:12px;
    font-weight:bold;
}

.close-modal{
    margin-top:10px;
}

/* =========================
   HISTORIAL
========================= */

.history-list{
    max-height:400px;
    overflow-y:auto;
}

.history-item{
    display:flex;
    justify-content:space-between;
    padding:13px;
    border-radius:13px;
    background:#f4f1f6;
    margin-bottom:8px;
}

.empty{
    text-align:center;
    padding:30px 10px;
    color:#777;
}

/* =========================
   RESPONSIVE
========================= */

@media(min-width:600px){
    #app{
        min-height:900px;
        height:95vh;
        border-radius:30px;
        box-shadow:0 30px 100px rgba(0,0,0,.4);
    }

    .header{
        border-radius:30px 30px 0 0;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="login">

    <div class="login-box">

        <div class="logo">ML</div>

        <h1>MateLabs</h1>

        <p>Calculadora matemática avanzada</p>

        <input
            id="password"
            class="password"
            type="password"
            inputmode="numeric"
            maxlength="4"
            placeholder="••••"
        >

        <button class="login-button" onclick="entrar()">
            ENTRAR
        </button>

        <div id="error" class="error"></div>

    </div>

</section>


<!-- APP -->

<main id="app">

    <header class="header">

        <div class="header-title">
            Calculadora
        </div>

        <button class="menu-btn" onclick="abrirMenu()">
            ☰
        </button>

    </header>


    <section class="calculator">

        <div class="display">

            <div id="previous" class="previous"></div>

            <div id="current" class="current">0</div>

        </div>


        <div class="buttons">

            <button class="btn function" onclick="clearAll()">C</button>
            <button class="btn function" onclick="addValue('(')">( )</button>
            <button class="btn function" onclick="porcentaje()">%</button>
            <button class="btn operator" onclick="addValue('/')">÷</button>

            <button class="btn" onclick="addValue('7')">7</button>
            <button class="btn" onclick="addValue('8')">8</button>
            <button class="btn" onclick="addValue('9')">9</button>
            <button class="btn operator" onclick="addValue('*')">×</button>

            <button class="btn" onclick="addValue('4')">4</button>
            <button class="btn" onclick="addValue('5')">5</button>
            <button class="btn" onclick="addValue('6')">6</button>
            <button class="btn operator" onclick="addValue('-')">−</button>

            <button class="btn" onclick="addValue('1')">1</button>
            <button class="btn" onclick="addValue('2')">2</button>
            <button class="btn" onclick="addValue('3')">3</button>
            <button class="btn operator" onclick="addValue('+')">+</button>

            <button class="btn zero" onclick="addValue('0')">0</button>
            <button class="btn" onclick="addValue('.')">.</button>
            <button class="btn equals" onclick="calculate()">=</button>

        </div>

    </section>


    <!-- MENU -->

    <aside id="menu" class="menu">

        <div class="menu-head">

            <h2>MateLabs</h2>

            <button class="close-menu" onclick="cerrarMenu()">×</button>

        </div>


        <div class="menu-content">

            <div class="menu-section">

                <h3>Problemas matemáticos</h3>

                <button class="menu-item" onclick="abrirProblema('operaciones')">
                    <strong>Operaciones</strong>
                    <span>Sumas, restas, multiplicaciones y divisiones.</span>
                </button>

                <button class="menu-item" onclick="abrirProblema('porcentajes')">
                    <strong>Porcentajes</strong>
                    <span>Calculá descuentos, aumentos y porcentajes.</span>
                </button>

                <button class="menu-item" onclick="abrirProblema('potencias')">
                    <strong>Potencias</strong>
                    <span>Resolvé potencias de diferentes niveles.</span>
                </button>

                <button class="menu-item" onclick="abrirProblema('raices')">
                    <strong>Raíces cuadradas</strong>
                    <span>Entrená con raíces exactas.</span>
                </button>

                <button class="menu-item" onclick="abrirProblema('ecuaciones')">
                    <strong>Ecuaciones</strong>
                    <span>Encontrá el valor de X.</span>
                </button>

                <button class="menu-item" onclick="abrirProblema('fracciones')">
                    <strong>Fracciones</strong>
                    <span>Practicá operaciones con fracciones.</span>
                </button>

                <button class="menu-item" onclick="abrirProblema('geometria')">
                    <strong>Geometría</strong>
                    <span>Áreas y perímetros.</span>
                </button>

            </div>


            <div class="menu-section">

                <h3>Herramientas</h3>

                <button class="menu-item" onclick="abrirHistorial()">
                    <strong>Historial</strong>
                    <span>Consultá tus operaciones anteriores.</span>
                </button>

                <button class="menu-item" onclick="clearAll();cerrarMenu()">
                    <strong>Limpiar calculadora</strong>
                    <span>Restablece la pantalla.</span>
                </button>

            </div>

        </div>

    </aside>

</main>


<!-- MODAL PROBLEMAS -->

<div id="problemOverlay" class="overlay">

    <div class="modal">

        <h2 id="problemTitle">Problema</h2>

        <p id="problemDescription" class="modal-description"></p>

        <div class="problem">

            <div id="problemText" class="problem-text"></div>

            <input
                id="answer"
                class="answer-input"
                type="number"
                inputmode="decimal"
                placeholder="Escribí tu respuesta"
            >

        </div>

        <button class="action" onclick="comprobarProblema()">
            COMPROBAR
        </button>

        <div id="problemResult" class="result"></div>

        <button class="action secondary close-modal" onclick="cerrarProblema()">
            CERRAR
        </button>

    </div>

</div>


<!-- MODAL HISTORIAL -->

<div id="historyOverlay" class="overlay">

    <div class="modal">

        <h2>Historial</h2>

        <p class="modal-description">
            Tus últimas operaciones realizadas.
        </p>

        <div id="historyList" class="history-list"></div>

        <button class="action secondary" onclick="cerrarHistorial()">
            CERRAR
        </button>

    </div>

</div>


<script>

/* =========================
   CONTRASEÑA
========================= */

const CONTRASENA = "4231";

function entrar(){

    const pass = document.getElementById("password").value;
    const error = document.getElementById("error");

    if(pass === CONTRASENA){

        document.getElementById("login").style.display = "none";
        document.getElementById("app").style.display = "block";

    }else{

        error.textContent = "Contraseña incorrecta.";
        document.getElementById("password").value = "";

    }
}

document.getElementById("password").addEventListener("keydown",function(e){

    if(e.key === "Enter"){
        entrar();
    }

});


/* =========================
   CALCULADORA
========================= */

let current = "";
let previous = "";
let history = [];

const currentDisplay = document.getElementById("current");
const previousDisplay = document.getElementById("previous");

function updateDisplay(){

    currentDisplay.textContent = current || "0";
    previousDisplay.textContent = previous;

}

function addValue(value){

    if(value === "("){

        if(current !== "" && /[0-9)]$/.test(current)){
            current += "*(";
        }else{
            current += "(";
        }

    }else{

        current += value;

    }

    updateDisplay();
}


function clearAll(){

    current = "";
    previous = "";

    updateDisplay();

}


function calculate(){

    if(!current) return;

    try{

        let expression = current;

        let result = Function(
            '"use strict"; return (' + expression + ')'
        )();

        if(!isFinite(result)){
            throw new Error();
        }

        result = Math.round(result * 100000000) / 100000000;

        history.unshift({
            operation: current,
            result: result
        });

        if(history.length > 30){
            history.pop();
        }

        previous = current + " =";
        current = String(result);

        updateDisplay();

    }catch{

        current = "";
        previous = "Operación inválida";

        updateDisplay();

    }

}


function porcentaje(){

    if(!current) return;

    try{

        let result = Function(
            '"use strict"; return (' + current + ')'
        )();

        result = result / 100;

        history.unshift({
            operation: current + "%",
            result: result
        });

        current = String(result);
        previous = current + "%";

        updateDisplay();

    }catch{

        previous = "Error";
        updateDisplay();

    }

}


/* =========================
   TECLADO
========================= */

document.addEventListener("keydown",function(e){

    if(document.getElementById("app").style.display !== "block"){
        return;
    }

    if(
        (e.key >= "0" && e.key <= "9") ||
        e.key === "+" ||
        e.key === "-" ||
        e.key === "*" ||
        e.key === "/" ||
        e.key === "." ||
        e.key === "(" ||
        e.key === ")"
    ){

        addValue(e.key);

    }

    if(e.key === "Enter"){
        calculate();
    }

    if(e.key === "Escape"){
        clearAll();
    }

    if(e.key === "Backspace"){

        current = current.slice(0,-1);
        updateDisplay();

    }

});


/* =========================
   MENU
========================= */

function abrirMenu(){

    document.getElementById("menu").classList.add("open");

}

function cerrarMenu(){

    document.getElementById("menu").classList.remove("open");

}


/* =========================
   PROBLEMAS
========================= */

let tipoActual = "";
let respuestaCorrecta = 0;

function abrirProblema(tipo){

    cerrarMenu();

    tipoActual = tipo;

    const overlay = document.getElementById("problemOverlay");

    const title = document.getElementById("problemTitle");
    const description = document.getElementById("problemDescription");
    const text = document.getElementById("problemText");
    const answer = document.getElementById("answer");
    const result = document.getElementById("problemResult");

    answer.value = "";
    result.textContent = "";

    if(tipo === "operaciones"){

        title.textContent = "Operaciones";

        description.textContent =
            "Resolvé la operación matemática.";

        let a = random(10,999);
        let b = random(2,99);

        respuestaCorrecta = a + b;

        text.textContent = a + " + " + b;

    }


    if(tipo === "porcentajes"){

        title.textContent = "Porcentajes";

        description.textContent =
            "Calculá el porcentaje indicado.";

        let numero = random(10,500) * 10;
        let porcentaje = [10,20,25,50][random(0,3)];

        respuestaCorrecta =
            numero * porcentaje / 100;

        text.textContent =
            porcentaje + "% de " + numero;

    }


    if(tipo === "potencias"){

        title.textContent = "Potencias";

        description.textContent =
            "Calculá la potencia.";

        let base = random(2,10);
        let exponente = random(2,4);

        respuestaCorrecta =
            Math.pow(base,exponente);

        text.textContent =
            base + " ^ " + exponente;

    }


    if(tipo === "raices"){

        title.textContent = "Raíces cuadradas";

        description.textContent =
            "Encontrá la raíz cuadrada exacta.";

        let n = random(1,10);

        respuestaCorrecta = n;

        text.textContent =
            "√" + (n*n);

    }


    if(tipo === "ecuaciones"){

        title.textContent = "Ecuaciones";

        description.textContent =
            "Encontrá el valor de X.";

        let x = random(2,20);
        let a = random(2,10);
        let b = random(1,30);

        let total = a*x+b;

        respuestaCorrecta = x;

        text.textContent =
            a + "x + " + b + " = " + total;

    }


    if(tipo === "fracciones"){

        title.textContent = "Fracciones";

        description.textContent =
            "Resolvé la suma de fracciones.";

        let a = random(1,5);
        let b = random(2,8);

        let c = random(1,5);
        let d = b;

        respuestaCorrecta = a/b+c/d;

        text.textContent =
            a + "/" + b + " + " + c + "/" + d;

    }


    if(tipo === "geometria"){

        title.textContent = "Geometría";

        description.textContent =
            "Calculá el área del rectángulo.";

        let base = random(3,20);
        let altura = random(3,20);

        respuestaCorrecta = base * altura;

        text.textContent =
            "Área: " + base + " × " + altura;

    }

    overlay.classList.add("show");

    setTimeout(()=>{
        answer.focus();
    },100);

}


function comprobarProblema(){

    const value =
        Number(document.getElementById("answer").value);

    const result =
        document.getElementById("problemResult");

    if(value === respuestaCorrecta){

        result.textContent = "Correcto. Excelente trabajo.";
        result.style.color = "#16a34a";

    }else{

        result.textContent =
            "Incorrecto. La respuesta correcta es " +
            respuestaCorrecta + ".";

        result.style.color = "#dc2626";

    }

}


function cerrarProblema(){

    document
        .getElementById("problemOverlay")
        .classList.remove("show");

}


/* =========================
   HISTORIAL
========================= */

function abrirHistorial(){

    cerrarMenu();

    const list =
        document.getElementById("historyList");

    if(history.length === 0){

        list.innerHTML =
            '<div class="empty">Todavía no hay operaciones.</div>';

    }else{

        list.innerHTML = history.map(item => {

            return `
                <div class="history-item">
                    <span>${escapeHTML(item.operation)}</span>
                    <strong>${item.result}</strong>
                </div>
            `;

        }).join("");

    }

    document
        .getElementById("historyOverlay")
        .classList.add("show");

}


function cerrarHistorial(){

    document
        .getElementById("historyOverlay")
        .classList.remove("show");

}


/* =========================
   UTILIDADES
========================= */

function random(min,max){

    return Math.floor(
        Math.random() * (max-min+1)
    ) + min;

}


function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

</script>
