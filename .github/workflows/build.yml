name: Crear APK Calculadora Nova

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Crear proyecto Android
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/calculadoranova/app
          mkdir -p app/src/main/res/values

          cp index.html app/src/main/assets/index.html

          if [ -f manifest.json ]; then
            cp manifest.json app/src/main/assets/manifest.json
          fi

          if [ -f sw.js ]; then
            cp sw.js app/src/main/assets/sw.js
          fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CalculadoraNova"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.calculadoranova.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.calculadoranova.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="Calculadora Nova"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#7c3aed</item>
                  <item name="android:statusBarColor">#080808</item>
                  <item name="android:navigationBarColor">#080808</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/calculadoranova/app/MainActivity.java <<'EOF'
          package com.calculadoranova.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );

                  setContentView(webView);
              }
          }
          EOF

      - name: Descargar Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          export PATH="$PWD/gradle-8.7/bin:$PATH"
          gradle --version

      - name: Compilar APK
        run: |
          export PATH="$PWD/gradle-8.7/bin:$PATH"
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CalculadoraNova
          path: app/build/outputs/apk/debug/app-debug.apk
